# Rebuilds the site daily so the build-time CBS data (the default result and
# the "Wat is geld van vroeger nu waard?" table) picks up new monthly figures.
# The build itself runs on Cloudflare Workers Builds; this only pings its
# Deploy Hook. See Hosting in AGENTS.md.
name: Scheduled rebuild

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Deploy Hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::error::The CLOUDFLARE_DEPLOY_HOOK_URL repository secret is not set."
            exit 1
          fi
          curl --fail-with-body --silent --show-error -X POST "$DEPLOY_HOOK_URL"
